name: mochi_ui
description: >-
  Mochi's design system for the Flutter apps: the iPhone's colour tokens in light and dark, the type scale in Nunito
  (bundled here, SIL OFL), and the clay building blocks (surface, card, backdrop, tags, pills, section titles). Used by
  mochi_desktop; mochi_pocket can move onto it (it still has its own copy of the theme and of the font files).
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  # Nunito (SIL OFL 1.1, fonts/OFL.txt; no Reserved Font Name): the same static instances as mochi_pocket's fonts/
  # (made from google/fonts ofl/nunito/Nunito[wght].ttf v3.602, commit 8b0a1d0f5983c89bc2b93f1b5fb55f9e252744b5, with
  # fontTools 4.60.1, because Flutter 3.35 doesn't map FontWeight onto a variable font's wght axis). Apps name the
  # family `packages/mochi_ui/Nunito` (mochiFontFamily).
  fonts:
    - family: Nunito
      fonts:
        - asset: fonts/Nunito-Regular.ttf
          weight: 400
        - asset: fonts/Nunito-Medium.ttf
          weight: 500
        - asset: fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: fonts/Nunito-Bold.ttf
          weight: 700
        - asset: fonts/Nunito-ExtraBold.ttf
          weight: 800
