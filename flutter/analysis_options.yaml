# Shared by every package in the workspace. The lint rules are listed here (rather than
# included from package:flutter_lints) so the workspace depends on the Flutter SDK only.
formatter:
  page_width: 140

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    - "**/build/**"
    - "tools/**"

linter:
  rules:
    - always_declare_return_types
    - annotate_overrides
    - avoid_empty_else
    - avoid_print
    - avoid_relative_lib_imports
    - avoid_returning_null_for_void
    - avoid_types_as_parameter_names
    - await_only_futures
    - camel_case_types
    - curly_braces_in_flow_control_structures
    - empty_catches
    - library_private_types_in_public_api
    - no_duplicate_case_values
    - non_constant_identifier_names
    - prefer_const_constructors_in_immutables
    - prefer_final_fields
    - prefer_is_empty
    - prefer_is_not_empty
    - prefer_single_quotes
    - sort_child_properties_last
    - unnecessary_new
    - unnecessary_this
    - use_key_in_widget_constructors
    - valid_regexps
